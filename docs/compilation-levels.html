  }
  plot.replaceChildren();
  detail.textContent = "Hover over or focus an outlier for its matched-trial details.";
  const values = distributions.flat();
  if (!values.length) {
    summary.textContent = "No matched Level 0 trials for this selection.";
    return;
  }
  const min = Math.min(0, ...values), max = Math.max(0, ...values);
  const extent = Math.max(Math.abs(min), Math.abs(max)) || 1;
  // Signed logarithm keeps zero and both signs visible when there are large outliers.
  const unit = extent / 100;
  const transform = value => Math.sign(value) * Math.log1p(Math.abs(value) / unit);
  const low = Math.min(0, transform(min)) - 0.35;
  const high = Math.max(0, transform(max)) + 0.35;
  const x = value => 130 + 550 * (transform(value) - low) / (high - low);
  const ticks = [0];
  const fidelity = Number(metric.value) === 4;
  const decade = 10 ** Math.floor(Math.log10(extent));
  const tickValues = [decade / 100, decade / 10, decade];
  if (extent >= 3 * decade) tickValues.push(3 * decade);
  for (const value of tickValues) {
    if (!fidelity && value < 1) continue;
    if (value <= max) ticks.push(value);
    if (-value >= min) ticks.push(-value);
  }
  for (const tick of ticks) {
    mark("line", {x1:x(tick), x2:x(tick), y1:45, y2:275, stroke:"currentColor", opacity:tick === 0 ? .6 : .2});
    mark("text", {x:x(tick), y:298, "text-anchor":"middle", fill:"currentColor"}, format(tick));
  }
  mark("text", {x:405, y:326, "text-anchor":"middle", fill:"currentColor"}, metrics[Number(metric.value)] + " vs Level 0 (signed log)");
  const details = distributions.map((sorted, index) => {
    const y = 80 + index * 80;
    const label = "Level " + (index + 1);
    mark("text", {x:118, y:y+4, "text-anchor":"end", fill:"currentColor"}, label + " · n=" + sorted.length);
    if (!sorted.length) return label + " has no matched trials";
    sorted.sort((a, b) => a - b);
    const q1 = quantile(sorted, .25), median = quantile(sorted, .5), q3 = quantile(sorted, .75);
    const iqr = q3 - q1;
    const lower = sorted.find(value => value >= q1 - 1.5 * iqr);
    const upper = sorted.findLast(value => value <= q3 + 1.5 * iqr);
    const line = (y1, y2, value1, value2) =>
      mark("line", {x1:x(value1), x2:x(value2), y1, y2, stroke:"currentColor", "stroke-width":2});
    line(y, y, lower, upper);
    line(y-15, y+15, lower, lower);
    line(y-15, y+15, upper, upper);
    const box = mark("rect", {x:x(q1), y:y-23, width:Math.max(2, x(q3)-x(q1)), height:46,
      fill:"#3182bd", stroke:"currentColor", tabindex:0, role:"img"});
    const description = label + ", " + sorted.length + " pairs, median " + format(median) +
      ", middle 50% " + format(q1) + " to " + format(q3) +
      ", whiskers " + format(lower) + " to " + format(upper);
    box.setAttribute("aria-label", description);
    const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
    title.textContent = description;
    box.append(title);
    line(y-23, y+23, median, median);
    for (const outlier of new Set(sorted.filter(value => value < lower || value > upper))) {
      const runs = observations[index].get(outlier);
      const description = label + " vs Level 0 · " + metrics[Number(metric.value)] +
        " · " + format(outlier) + "\n" + runs.map(([name, device, method, seed]) =>
          [name, device, method || "Original circuit", "Seed " + seed].join(" · ")
        ).join("\n");
      const dot = mark("circle", {cx:x(outlier), cy:y, r:4, fill:"currentColor", opacity:.7,
        tabindex:0, role:"img", "aria-label":description});
      const tooltip = document.createElementNS("http://www.w3.org/2000/svg", "title");
      tooltip.textContent = description;
      dot.append(tooltip);
      for (const event of ["mouseenter", "focus"]) {
        dot.addEventListener(event, () => { detail.textContent = description; });
      }
    }
    return label + " median " + format(median);
  });
  summary.textContent = details.join(" · ");
}
draw();
</script>
</html>
